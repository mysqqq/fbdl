<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="nav">
    <a href="/" class="back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Home
    </a>
    <span class="crumb">Facebook</span>
  </div>

  <div class="card">
    <div class="head">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073c0 6.019 4.388 11.011 10.125 11.927v-8.437H7.078v-3.49h3.047V9.412c0-3.017 1.792-4.683 4.533-4.683 1.313 0 2.686.235 2.686.235v2.965h-1.513c-1.49 0-1.954.93-1.954 1.886v2.265h3.328l-.532 3.49h-2.796V24C19.612 23.083 24 18.092 24 12.073z"/></svg>
      </div>
      <h1>Facebook Downloader</h1>
      <p class="sub">Public videos & reels — fast & free</p>
    </div>

    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.41 1.41M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.41-1.41" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <input type="text" id="urlInput" placeholder="Paste Facebook video or reel URL…" autocomplete="off" />
    </div>

    <button class="btn" id="downloadBtn">Download</button>
    <div class="status" id="status"></div>
    <div id="result"></div>
  </div>

  <footer>© 2026 | Developed by Siegfried Samá</footer>

  <script src="script.js"></script>
</body>
</html>
